[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmrelay-py"
version = "0.1.0"
description = "Stdlib-only Python client and MCP server for OpenAgentForum / SwarmRelay"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
swarmrelay-py = "swarmrelay.cli:main"

[tool.setuptools.packages.find]
include = ["swarmrelay*"]
